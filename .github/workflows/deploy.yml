name: Deploy to GitHub Pages

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
      inputs.manual_test_mode != 'repository' &&
      format('Deploy Pages [manual:{0}]', inputs.manual_test_session_id) ||
      'Deploy to GitHub Pages' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      manual_test_mode:
        description: Pages build mode
        required: true
        default: repository
        type: choice
        options:
          - repository
          - manual-on
          - manual-off
      manual_test_session_id:
        description: Manual-test session ID (required outside repository mode)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_HANDWRITING_IMPORT_ENABLED: ${{ vars.VITE_HANDWRITING_IMPORT_ENABLED }}
      REPOSITORY_HANDWRITING_DIAGNOSTICS_ENABLED: ${{ vars.VITE_HANDWRITING_DIAGNOSTICS_ENABLED }}
      VITE_HANDWRITING_IMPORT_ENDPOINT: ${{ vars.VITE_HANDWRITING_IMPORT_ENDPOINT }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Prepare deployment state
        env:
          MANUAL_TEST_MODE: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.manual_test_mode || 'repository' }}
          MANUAL_TEST_SESSION_ID: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.manual_test_session_id || '' }}
        run: node scripts/write-handwriting-deployment-state.mjs prepare

      - name: Build
        env:
          BASE_PATH: /otsukai/
        run: npm run build

      - name: Write deployment state manifest
        run: node scripts/write-handwriting-deployment-state.mjs write

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
