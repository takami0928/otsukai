name: Verify pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR context and diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "base_sha=${BASE_SHA}"
          echo "head_sha=${HEAD_SHA}"
          echo "tested_merge_sha=${TESTED_MERGE_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --check "${BASE_SHA}...${HEAD_SHA}"
          git diff --check

          {
            echo "### PR verification context"
            echo "- Base SHA: \`${BASE_SHA}\`"
            echo "- Head SHA: \`${HEAD_SHA}\`"
            echo "- Tested merge commit SHA: \`${TESTED_MERGE_SHA}\`"
            echo "- Branch-range and working-tree diff checks: passed"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Worker tests
        run: npm run test:worker

      - name: Worker bundle check
        run: npm run check:worker-bundle

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
